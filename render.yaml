# Exemplo para aplicar após a homologação da operação do SQLite.
services:
  - type: web
    name: chatflow-painel
    runtime: docker
    plan: starter
    # Usa o ENTRYPOINT da imagem para encaminhar SIGTERM ao Node.
    dockerfilePath: ./Dockerfile
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /saude
    disk:
      name: chatflow-dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CHATFLOW_BANCO
        value: sqlite
      - key: CHATFLOW_BANCO_ARQUIVO
        value: /var/data/chatflow.sqlite
      - key: CHATFLOW_DESLIGAR_MS
        value: "10000"
      - key: CHATFLOW_CONFIAR_PROXY
        value: "1"
      - key: CHATFLOW_TOKEN_CLIENTE
        sync: false
      - key: CHATFLOW_TOKEN_INTEGRACAO
        sync: false
      - key: CHATFLOW_ADMIN_SENHA
        sync: false
      - key: CHATFLOW_CORS_ORIGENS
        sync: false
