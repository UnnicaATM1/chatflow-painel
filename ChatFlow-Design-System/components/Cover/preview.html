<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--surface-page); }
  .wrap { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface-page); font-family: var(--font-sans); }
  svg { position: absolute; inset: 0; }
  .brand { fill: var(--brand-500); }
  .deep { fill: var(--navy-950); }
  [data-theme="dark"] .deep { fill: var(--navy-700); }
  .tint { fill: var(--brand-50); }
  .signal { fill: var(--status-pendente); }
  .cap-line { fill: none; stroke: var(--brand-500); stroke-width: 2; }
  .cap-fill { fill: var(--brand-500); }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  h1 { margin: 0; font-size: 80px; line-height: .95; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); }
  p { margin: 12px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style></head>
<body>
<div class="wrap">
  <svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
    <!-- blocks: brand-500 slab 200x248 radius-xl; navy-950 152x148; brand-50 152x152; status-pendente 72x48 radius-lg -->
    <!-- arrangement: one tall slab bleeding off the top with two satellites bleeding right and bottom, small signal block on the left -->
    <!-- pattern: literal motif, the mark's vertical capsule (radius-pill) repeated; chosen because the logo IS a capsule in a rounded square -->
    <!-- scales: gaps space-2 (8px), slab inset space-4/space-8, capsules 16x32 rx 8 at space-6 pitch -->
    <rect class="brand" x="600" y="-12" width="200" height="248" rx="12"/>
    <rect class="deep" x="660" y="48" width="80" height="128" rx="40"/>
    <circle class="brand" cx="700" cy="112" r="18"/>
    <rect class="deep" x="808" y="-12" width="164" height="160" rx="12"/>
    <rect class="tint" x="808" y="156" width="164" height="156" rx="12"/>
    <rect class="signal" x="520" y="188" width="72" height="48" rx="8"/>
    <g class="cap-line">
      <rect x="836" y="28" width="16" height="32" rx="8"/><rect x="876" y="28" width="16" height="32" rx="8"/><rect x="916" y="28" width="16" height="32" rx="8"/>
      <rect x="836" y="84" width="16" height="32" rx="8"/><rect x="876" y="84" width="16" height="32" rx="8"/><rect x="916" y="84" width="16" height="32" rx="8"/>
    </g>
    <g class="cap-fill">
      <rect x="836" y="188" width="16" height="32" rx="8"/><rect x="876" y="188" width="16" height="32" rx="8"/><rect x="916" y="188" width="16" height="32" rx="8"/>
      <rect x="836" y="244" width="16" height="32" rx="8"/>
    </g>
  </svg>
  <div class="text">
    <h1>ChatFlow</h1>
    <p>Inteligência operacional para quem toca a casa: pedidos, equipe e salão num lugar só.</p>
  </div>
</div>
</body>
</html>
