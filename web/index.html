<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kendji ONE</title>
<link rel="stylesheet" href="/app/tokens.css">
<link rel="stylesheet" href="/app/bundle.css">
<style>
  body { margin: 0; background: var(--surface-page); color: var(--ink); font-family: var(--font-sans); }
  .pagina { padding: var(--space-6); max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-4); }
  .painel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-4); }
  h1 { font: 700 20px/28px var(--font-sans); margin: 0; }
  h2 { font: 600 14px/20px var(--font-sans); margin: 0 0 var(--space-2); }
  .mono { font-family: var(--font-mono); }
  .rotulo { font: 500 10px/14px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
  input, select { font: 400 13px/20px var(--font-sans); padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-card); color: var(--ink); }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font: 500 10px/14px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); padding: 8px; border-bottom: 1px solid var(--border); }
  td { padding: 8px; border-bottom: 1px solid var(--border); }
  .mesas { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .mesa { min-width: 96px; text-align: left; background: var(--surface-card); border: 1px solid var(--border-strong); border-left: 3px solid var(--status-realizado); border-radius: var(--radius-lg); padding: 10px 12px; cursor: pointer; font: 500 12px/16px var(--font-sans); color: var(--ink); }
  .mesa b { display: block; font: 700 16px/20px var(--font-mono); }
  .mesa[data-situacao="reservada"] { border-left-color: var(--status-pendente); background: var(--surface-sunken); }
  .mesa[aria-pressed="true"] { outline: 2px solid var(--brand-500); }
  .mesa:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; }
  .grade { display: grid; grid-template-columns: 1fr 280px; gap: var(--space-4); }
  @media (max-width: 760px) { .pagina { padding: var(--space-4); } .grade { grid-template-columns: 1fr; } }
  .erro { color: var(--danger); font-size: 13px; }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo textarea { font: 400 13px/20px var(--font-sans); padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--surface-card); color: var(--ink); min-height: 72px; width: 100%; box-sizing: border-box; }
  .campo textarea:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 1px; }
</style>
</head>
<body>
<div id="root" class="k1"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="/app/bundle.js"></script>
<script src="/app/app.js"></script>
</body>
</html>
